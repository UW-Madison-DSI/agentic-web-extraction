[project]
name = "agentic-web-extraction"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason Lo", email = "lcmjlo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markitdown>=0.1.5",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.8.0",
    "tldextract>=5.3.1",
    "typer>=0.25.1",
]

[project.optional-dependencies]
# Browser TLS/HTTP fingerprint for the "impersonate" recovery route (see
# fallback.py). Optional so the base install is unchanged and a deployment that
# never enables AWE_IMPERSONATE never needs the binary wheel -- the route
# declines with a log line when the import fails. Ships a bundled
# libcurl-impersonate, so confirm a wheel exists for your image (glibc vs musl).
impersonate = ["curl_cffi>=0.15"]

[project.scripts]
awe = "agentic_web_extraction:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
